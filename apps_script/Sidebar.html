<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        --azul: #1a73e8;
        --azul-escuro: #1558b0;
        --cinza-bolha: #f1f3f4;
        --cinza-texto: #5f6368;
        --texto: #202124;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Google Sans', Roboto, Arial, sans-serif;
        color: var(--texto);
        background: #ffffff;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      #cabecalho {
        flex: 0 0 auto;
        padding: 14px 16px 10px;
        border-bottom: 1px solid #e8eaed;
      }

      #cabecalho h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      #cabecalho p {
        margin: 4px 0 0;
        font-size: 11.5px;
        color: var(--cinza-texto);
      }

      #mensagens {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .linha { display: flex; }
      .linha.usuario { justify-content: flex-end; }
      .linha.assistente { justify-content: flex-start; }

      .bolha {
        max-width: 84%;
        padding: 9px 12px;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .bolha.usuario {
        background: var(--azul);
        color: #fff;
        border-radius: 14px 14px 3px 14px;
      }

      .bolha.assistente {
        background: var(--cinza-bolha);
        color: var(--texto);
        border-radius: 14px 14px 14px 3px;
      }

      .bolha.erro {
        background: #fce8e6;
        color: #c5221f;
        border-radius: 14px 14px 14px 3px;
      }

      .digitando {
        display: inline-flex;
        gap: 3px;
        padding: 11px 14px;
        background: var(--cinza-bolha);
        border-radius: 14px 14px 14px 3px;
      }

      .digitando span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #9aa0a6;
        animation: pulso 1.2s infinite ease-in-out;
      }

      .digitando span:nth-child(2) { animation-delay: 0.2s; }
      .digitando span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes pulso {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
        30% { transform: translateY(-4px); opacity: 1; }
      }

      #vazio {
        margin: auto;
        text-align: center;
        color: var(--cinza-texto);
        font-size: 12.5px;
        padding: 0 20px;
      }

      #vazio .emoji { font-size: 26px; display: block; margin-bottom: 8px; }

      #rodape {
        flex: 0 0 auto;
        border-top: 1px solid #e8eaed;
        padding: 10px;
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }

      #pergunta {
        flex: 1;
        resize: none;
        border: 1px solid #dadce0;
        border-radius: 18px;
        padding: 9px 14px;
        font-size: 13px;
        font-family: inherit;
        line-height: 1.4;
        max-height: 90px;
        outline: none;
      }

      #pergunta:focus { border-color: var(--azul); }

      #enviar {
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        background: var(--azul);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
      }

      #enviar:hover:not(:disabled) { background: var(--azul-escuro); }
      #enviar:disabled { background: #dadce0; cursor: default; }

      #enviar svg { width: 16px; height: 16px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="cabecalho">
        <h1>🤖 Assistente IA</h1>
        <p>Pergunte sobre visitas, vendas e receita dos seus anúncios</p>
      </div>

      <div id="mensagens">
        <div id="vazio">
          <span class="emoji">💬</span>
          Faça uma pergunta sobre os dados da planilha,<br>por exemplo: <em>"quais anúncios caíram mais essa semana?"</em>
        </div>
      </div>

      <div id="rodape">
        <textarea id="pergunta" rows="1" placeholder="Escreva sua pergunta..."></textarea>
        <button id="enviar" onclick="perguntar()" title="Enviar">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

    <script>
      const caixaMensagens = document.getElementById('mensagens');
      const campoPergunta = document.getElementById('pergunta');
      const botaoEnviar = document.getElementById('enviar');
      let indicadorAtual = null;

      campoPergunta.addEventListener('input', function () {
        campoPergunta.style.height = 'auto';
        campoPergunta.style.height = Math.min(campoPergunta.scrollHeight, 90) + 'px';
      });

      campoPergunta.addEventListener('keydown', function (evento) {
        if (evento.key === 'Enter' && !evento.shiftKey) {
          evento.preventDefault();
          perguntar();
        }
      });

      function removerEstadoVazio() {
        const vazio = document.getElementById('vazio');
        if (vazio) vazio.remove();
      }

      function adicionarBolha(texto, tipo) {
        removerEstadoVazio();
        const linha = document.createElement('div');
        linha.className = 'linha ' + (tipo === 'usuario' ? 'usuario' : 'assistente');

        const bolha = document.createElement('div');
        bolha.className = 'bolha ' + tipo;
        bolha.textContent = texto;

        linha.appendChild(bolha);
        caixaMensagens.appendChild(linha);
        caixaMensagens.scrollTop = caixaMensagens.scrollHeight;
        return linha;
      }

      function mostrarDigitando() {
        const linha = document.createElement('div');
        linha.className = 'linha assistente';
        linha.innerHTML = '<div class="digitando"><span></span><span></span><span></span></div>';
        caixaMensagens.appendChild(linha);
        caixaMensagens.scrollTop = caixaMensagens.scrollHeight;
        return linha;
      }

      function perguntar() {
        const pergunta = campoPergunta.value.trim();
        if (!pergunta) return;

        adicionarBolha(pergunta, 'usuario');
        campoPergunta.value = '';
        campoPergunta.style.height = 'auto';

        botaoEnviar.disabled = true;
        indicadorAtual = mostrarDigitando();

        google.script.run
          .withSuccessHandler(function (texto) {
            if (indicadorAtual) { indicadorAtual.remove(); indicadorAtual = null; }
            adicionarBolha(texto, 'assistente');
            botaoEnviar.disabled = false;
            campoPergunta.focus();
          })
          .withFailureHandler(function (erro) {
            if (indicadorAtual) { indicadorAtual.remove(); indicadorAtual = null; }
            adicionarBolha('Erro: ' + erro.message, 'erro');
            botaoEnviar.disabled = false;
          })
          .perguntarIA(pergunta);
      }
    </script>
  </body>
</html>
