name: Rotina diária

# Roda a coleta + comparação + Sheets + análise de IA (main.py rotina_diaria)
# uma vez por dia, pra todas as contas ativas cadastradas no banco, sem
# depender de alguém rodar manualmente. Ver database/contas.py e
# main.py::_rotina_diaria().
on:
  schedule:
    # O GitHub Actions não garante o horário exato de um "schedule" - pode
    # atrasar (às vezes horas) em picos de carga na infraestrutura deles, e
    # já aconteceu de não disparar nenhuma vez num dia. Por isso dois
    # disparos por dia, bem adiantados em relação ao prazo real (07:30 no
    # horário de Brasília) - a rotina é segura de rodar mais de uma vez
    # (grava por UPSERT, sem duplicar dado), então o segundo disparo é só
    # uma rede de segurança: se o primeiro já rodou certinho, o segundo
    # reprocessa e confirma; se o primeiro atrasou ou falhou, o segundo
    # cobre o buraco.
    - cron: "0 4 * * *"  # 04:00 UTC = 01:00 Brasília (sem horário de verão)
    - cron: "0 7 * * *"  # 07:00 UTC = 04:00 Brasília
  workflow_dispatch: {}  # permite rodar manualmente pela aba Actions do GitHub

jobs:
  rotina-diaria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Escrever credencial do Google Sheets
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > config/google_service_account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Rodar rotina diária
        env:
          ML_HC_CLIENT_ID: ${{ secrets.ML_HC_CLIENT_ID }}
          ML_HC_CLIENT_SECRET: ${{ secrets.ML_HC_CLIENT_SECRET }}
          ML_HC_REDIRECT_URI: ${{ secrets.ML_HC_REDIRECT_URI }}
          ML_WC_CLIENT_ID: ${{ secrets.ML_WC_CLIENT_ID }}
          ML_WC_CLIENT_SECRET: ${{ secrets.ML_WC_CLIENT_SECRET }}
          ML_WC_REDIRECT_URI: ${{ secrets.ML_WC_REDIRECT_URI }}
          ML_CC_CLIENT_ID: ${{ secrets.ML_CC_CLIENT_ID }}
          ML_CC_CLIENT_SECRET: ${{ secrets.ML_CC_CLIENT_SECRET }}
          ML_CC_REDIRECT_URI: ${{ secrets.ML_CC_REDIRECT_URI }}
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_REDIRECT_URI: ${{ secrets.BLING_REDIRECT_URI }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python main.py rotina_diaria
